network: ieee8500
status: implemented_pandapower_sequence_approximation
source: https://github.com/tshort/OpenDSS/tree/5005c668a72d20775f4c2d060feebb2866ba1d38/Distrib/IEEETestCases/8500-Node
# Medium-voltage reduction of the balanced load case (scripts/build_ieee8500_data.py).
solver: pandapower.runpp_3ph
# Assumed daily shape (not an IEEE reference measurement); 1.0 = nominal 10.8 MW.
load_multipliers: [0.60, 0.58, 0.56, 0.55, 0.56, 0.60, 0.65, 0.72, 0.78, 0.80, 0.82, 0.83, 0.82, 0.80, 0.82, 0.86, 0.92, 0.98, 1.00, 0.98, 0.92, 0.82, 0.72, 0.65]
# Land-use zoning (python -m integration.zoning; map only, the load model is unchanged). The IEEE data does not
# classify loads: these thresholds are study hypotheses, applied to each customer's service transformer.
zoning:
  residential_max_kva: 25          # service transformer up to 25 kVA: residential customer; larger: commercial
  industrial_min_kva_per_phase: 100  # a bus fed on all three phases by >= 100 kVA transformers: industrial customer
  cell_m: 1000                     # regions are square cells of 1 km
  commercial_share: 0.4            # commercial region: commercial customers hold >= 40 % of the cell's load
  industrial_radius_m: 1000        # industrial region: cells within 1 km of an industrial customer
