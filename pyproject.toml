[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "evcs-bess-v2g"
version = "0.1.0"
description = "Modular research demonstrator for EVCS, BESS and V2G"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "PyYAML>=6,<7", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4", "pandapower>=3.4,<3.5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
[project.scripts]
evcs-demo = "integration.coordinator:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
network = ["data/*.json", "data/*.txt"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
