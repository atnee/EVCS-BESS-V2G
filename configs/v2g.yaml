# Strategy cesar_v1 (src/v2g/strategies.py): fleet LP, valley recharge, spread peak discharge.
# Used only with strategy: cesar_v1; the price policy is checked against the discharge window in use.
cesar_v1:
  no_charge_window_h: [17, 22]      # decision: no fleet charging at the feeder peak
  # PLACEHOLDER tariff (hypothesis, no Honduran source yet): 0.10 for 0-6 h, 0.15 for 6-17 h, 0.30 for 17-22 h, 0.15 for 22-24 h
  tariff_usd_kwh: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.30, 0.30, 0.30, 0.30, 0.30, 0.15, 0.15]
  # PLACEHOLDER V2G remuneration (hypothesis): 0.30 for 17-20 h, 0.15 otherwise
  # (outside the discharge window it has no effect today: discharge is not allowed there)
  v2g_remuneration_usd_kwh: [0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.15, 0.30, 0.30, 0.30, 0.15, 0.15, 0.15, 0.15]
  degradation_usd_kwh: 0.0          # PLACEHOLDER (hypothesis)
  tie_break_usd_kw: 1.0e-4          # numerical tie-break only; much smaller than any price difference
