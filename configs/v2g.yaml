# Strategy cesar_v1 (src/v2g/strategies.py): fleet LP, valley recharge, spread peak discharge.
# Used only with strategy: cesar_v1; the price policy is checked against the discharge window in use.
cesar_v1:
  no_charge_window_h: [17, 22]      # decision: no fleet charging at the feeder peak
  # Dynamic tariff (built from tariff_basis below; tests check both agree): charge 1x 0-14 h and 22-24 h,
  # 2x 14-17 h (shoulder, commercial arrivals), 10x 17-22 h (no-charge peak). Base 0.2421 USD/kWh.
  tariff_usd_kwh: [0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.4841, 0.4841, 0.4841, 2.4207, 2.4207, 2.4207, 2.4207, 2.4207, 0.2421, 0.2421]
  # V2G remuneration: 2.5x in the 17-20 h discharge window, 1x otherwise
  # (outside the discharge window it has no effect: discharge is not allowed there)
  v2g_remuneration_usd_kwh: [0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.2421, 0.6052, 0.6052, 0.6052, 0.2421, 0.2421, 0.2421, 0.2421]
  degradation_usd_kwh: 0.0          # hypothesis: battery degradation not priced (as in Moreira et al.); stated as a limitation
  tie_break_usd_kw: 1.0e-4          # numerical tie-break only; much smaller than any price difference
# Dynamic tariff basis (read by v2g.report and tests only; cesar_v1 reads the vectors above).
# Structure adapted from Moreira et al., "Vehicle to Grid for Demand Response Optimization: A Case Study", Fig. 5.
tariff_basis:
  source: "CREE pliego tarifario IV trimestre 2026, Servicio Residencial, consumo > 50 kWh/mes (siguientes kWh)"
  base_hnl_kwh: 6.5102
  fx_source: "BCH tipo de cambio de referencia, 2026-10-20"
  fx_hnl_per_usd: 26.8936
  # [start_h, end_h, multiplier] on whole hours; 1x outside the listed blocks
  charge_multipliers:
    - [14, 17, 2.0]     # shoulder: commercial cars arrive (paper Fig. 5: 2x block)
    - [17, 22, 10.0]    # no-charge peak (paper Fig. 5: 10x)
  discharge_multipliers:
    - [17, 20, 2.5]     # decision: 2.5x (the paper uses 5x; too high for Honduras)
  days_per_month: 22    # Moreira et al., eq. (5)-(6)
  s1_billing: flat      # S1 (uncontrolled charging) billed at the base price all day
  demand_value_hnl_kw_month: 340.4170  # CREE Servicio en Media Tension, potencia; indicative value of the peak cut only
# S3 case (team agreement; see src/v2g/README.md). Read only by `python -m v2g.s3_configs`, which writes a complete
# config folder = copy of configs/ + these overrides, for `integration.coordinator --configs`. configs/ is unchanged.
s3_case:
  overrides:                       # file -> dotted key -> value
    v2g.yaml:
      strategy: cesar_v1                       # decision (Cesar)
      vehicle_source: fleet                    # 150-car S3 fleet (team agreement)
      departure_rule: arrival_plus_trip        # decision (Cesar): leave with arrival energy + trip
      discharge_window_h: [17, 20]             # Ayrton's indication
      standalone.station.chargers: 154         # team agreement: 150 cars + 4 ports for the independent demand
      standalone.station.connection_kw: 1694.0
      standalone.station.capex: 770000.0       # hypothesis: 5,000 USD per port
    evcs.yaml:
      station.chargers: 154                    # team agreement (bus m1125976 unchanged)
      station.connection_kw: 1694.0
      station.capex: 770000.0                  # hypothesis: 5,000 USD per port
      integration.evs: 2850                    # team agreement: the 150 V2G cars come out of the 3,000
  variants:
    B:                                         # exploratory only (not an agreed station): host station moved downstream
      v2g.yaml:
        standalone.station.bus: m1069504
      evcs.yaml:
        station.bus: m1069504                  # public DC hub at m1125976 (integration.sites) is unchanged
