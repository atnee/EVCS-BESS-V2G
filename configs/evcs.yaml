  id: EVCS-1
  bus: m1125976             # IEEE 8500: one of the DC hubs chosen by the screening
  phases: ABC
  chargers: 8
  charger_kw: 11.0
  connection_kw: 88.0
  capex: 40000.0
  currency: USD
  bidirectional: true
