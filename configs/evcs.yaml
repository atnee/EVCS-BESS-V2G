# Algorithm from src/evcs/strategies.py (STRATEGIES). Use 'template' to start your own.
strategy: fixed
time:
  start: '2026-01-01T00:00:00-06:00'
  steps: 24
  dt_h: 1.0
# V2G host station: where the V2G fleet (configs/v2g.yaml) connects in S1-S4. Its own demand comes from `strategy:`.
station:
  id: EVCS-1
  bus: m1125976             # IEEE 8500: DC hub site chosen by the screening for 2000 cars (IEEE123: '67')
  phases: ABC
  chargers: 8
  charger_kw: 11.0
  connection_kw: 88.0
  capex: 40000.0
  currency: USD
  bidirectional: true
