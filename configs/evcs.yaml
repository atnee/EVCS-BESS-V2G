# Algorithm from src/evcs/strategies.py (STRATEGIES). Use 'template' to start your own.
strategy: fixed
time:
  start: '2026-01-01T00:00:00-06:00'
  steps: 24
  dt_h: 1.0
# V2G host station: where the V2G fleet (configs/v2g.yaml) connects in S1-S4. Its own demand comes from `strategy:`.
