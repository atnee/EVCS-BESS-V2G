# Planning assumptions for siting/sizing (src/evcs/planning.py, src/evcs/README.md).
# Placeholders until Honduras data replaces them; the screening also sweeps `evs`.
planning:
  candidate_spacing_m: 250  # screening candidates: three-phase buses at least this far apart (0 = all)
  ac_siting: full_coverage  # eletropostos: full_coverage = optimal set covering every load within the radius
                            # (three-phase `ac` + single-phase `ac1`), greedy = maximal coverage with the sized count
  min_served_share: 0.95    # full_coverage: add AC charging capacity until 95% of the AC sessions are served
  seed: 42                  # same seed -> same sessions (reproducible)
  resolution_min: 15        # intraday power-flow step (minutes); sessions are simulated per minute
  charger_efficiency: 0.95  # grid power = charging power / efficiency
  sizing_quantile: 0.95     # chargers = 95th percentile of unconstrained simultaneous sessions
  # Mixed fleet (all values are hypotheses): private cars without home charging plus taxis/ride-hailing.
  # The network impact depends on the daily public energy, evs x share x daily_km x kwh_per_km x public_share:
  # ~9.1 kWh per vehicle per day here, so 1000-3000 vehicles ask 9-27 MWh/day from the stations.
  fleet:
    evs: 3000               # electric vehicles charging in the feeder area (main S1 case; sensitivity 1000-3000)
    max_ac_kw: 11.0         # on-board charger: limits AC charging
    max_dc_kw: 100.0        # vehicle DC acceptance: limits hub charging
    classes:
      private:
        share: 0.85         # 85 % of the vehicles
        battery_kwh: 44.9   # average usable battery (e.g. BYD Dolphin, 44.9 kWh)
        battery_std_kwh: 15.0
        daily_km: 40.0      # urban use
        kwh_per_km: 0.18
        public_share: 0.6   # many dwellings without a garage: 60 % at public stations, 40 % at home/work
        arrival_soc_mean: 0.30
        arrival_soc_std: 0.10
        services: {ac: 0.6, dc: 0.4}   # share of this class's public energy at AC eletropostos / DC hubs
      taxi:                 # taxis and ride-hailing: may live outside the feeder, charge where the hubs are
        share: 0.15
        battery_kwh: 60.0
        battery_std_kwh: 10.0
        daily_km: 200.0     # two shifts a day
        kwh_per_km: 0.18
        public_share: 1.0   # no home charging
        arrival_soc_mean: 0.25
        arrival_soc_std: 0.08
        services: {dc: 0.8, ac: 0.2}   # fast charging between rides; AC overnight
        arrival_shape:      # between rides: lunch and the evening shift change; AC sessions overnight
          dc: [2, 1, 1, 1, 1, 1, 2, 3, 3, 3, 4, 5, 6, 6, 5, 4, 4, 5, 6, 6, 5, 4, 3, 2]
          ac: [4, 4, 3, 2, 1, 1, 1, 1, 1, 1, 1, 2, 3, 3, 2, 1, 1, 1, 1, 2, 3, 4, 5, 5]
  station_types:
    ac:
      name: eletroposto
      charger_kw: 22.0
      chargers_per_site: 6
      share: 0.6            # 60% of the public energy at AC eletropostos
      target_soc: 0.9
      max_wait_min: 30      # gives up after waiting this long
      coverage_radius_m: 500.0
      min_spacing_m: 400.0
      arrival_shape: [0, 0, 0, 0, 0, 0, 1, 3, 5, 5, 4, 4, 4, 4, 4, 4, 5, 6, 6, 5, 3, 2, 1, 0]
      capex_usd: 60000.0    # per site: 20k fixed (land, connection, works) + 300 USD/kW x 132 kW (hypothesis)
    ac1:
      name: eletroposto monofásico
      charger_kw: 7.4       # single-phase 32 A charger
      chargers_per_site: 2
      share: 0.0            # no sessions of its own: it serves the AC sessions together with `ac`
      serves: ac
      phases: 1             # connects to one phase of a single-phase/two-phase lateral
      target_soc: 0.9
      max_wait_min: 30
      coverage_radius_m: 500.0
      min_spacing_m: 0.0
      arrival_shape: [0, 0, 0, 0, 0, 0, 1, 3, 5, 5, 4, 4, 4, 4, 4, 4, 5, 6, 6, 5, 3, 2, 1, 0]
      capex_usd: 24000.0    # per site: 20k fixed + 300 USD/kW x 14.8 kW (hypothesis)
    dc:
      name: hub
      charger_kw: 150.0
      chargers_per_site: 4
      share: 0.4            # 40% at DC hubs
      target_soc: 0.8       # fast charging usually stops at 80%
      max_wait_min: 15
      coverage_radius_m: 1500.0
      min_spacing_m: 800.0
      arrival_shape: [1, 0, 0, 0, 0, 1, 2, 4, 5, 4, 3, 3, 4, 3, 3, 4, 5, 6, 6, 5, 4, 3, 2, 1]
      capex_usd: 400000.0   # per site, 4 x 150 kW installed (hypothesis)
